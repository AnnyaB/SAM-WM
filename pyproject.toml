[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coolworld-sam"
version = "0.6.1"
description = "Real-evidence support-aware urban heat intervention intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "pyarrow>=23,<26",
  "cvxpy>=1.6,<2",
  "hydra-core==1.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]
ml = [
  "torch>=2.7,<3",
]
research = [
  "scikit-learn>=1.6,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coolworld"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "live: requires real network services / may consume FortyGuard credits",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
