[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sam-wm"
version = "1.1.0"
description = "Sparse Adaptive Mechanism World Model for evidence-bounded urban thermal intelligence"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "torch>=2.3,<3",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
app = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/coolworld"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
