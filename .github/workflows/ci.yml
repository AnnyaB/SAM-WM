name: ci
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,app]'
      - run: python -m compileall -q src train.py eval.py fortyguard_check.py plot.py summarize.py
      - run: ruff check src tests train.py eval.py fortyguard_check.py plot.py summarize.py
      - run: ruff format --check src tests train.py eval.py fortyguard_check.py plot.py summarize.py
      - run: pytest
