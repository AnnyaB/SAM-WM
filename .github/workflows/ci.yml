name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: python-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          'torch>=2.3,<3'
      - run: python -m pip install -e '.[dev,app]'
      - run: make PYTHON=python verify

  frontend:
    name: frontend-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check static/app.js
      - run: node --check static/bootstrap.js
      - run: node --check static/product.js
      - run: node --check static/interpretability.js
      - run: node --check static/city-model.js
      - name: Guard Safari startup and cache-version contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F '/static/bootstrap.js?v=0.8.1' static/index.html
          grep -F '/static/city-model.js?v=1.0.1' static/bootstrap.js
          python - <<'PY'
          from pathlib import Path

          city = Path('static/city-model.js').read_text(encoding='utf-8')
          boot = Path('static/bootstrap.js').read_text(encoding='utf-8')

          # Regression guard: observing timelineTruth while writing to it creates
          # a MutationObserver feedback loop that can starve Safari's event loop
          # and leave the loading overlay permanently visible.
          assert '.observe(timeline' not in city
          assert 'if (truth.textContent !== nextText)' in city

          # Presentation enhancements must not block the usable core 3D app.
          hide = "overlay.classList.add('hidden')"
          city_load = 'loadEnhancement(loadCityModel'
          assert hide in boot
          assert city_load in boot
          assert boot.index(hide) < boot.index(city_load)
          print('Safari startup regression contract passed')
          PY

  runtime-contract:
    name: immutable-runtime-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          'torch>=2.3,<3'
      - run: python -m pip install -e '.[dev,app]'
      - run: python verify_runtime.py

  docker-smoke:
    name: docker-public-demo-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -t sam-wm-coolworld:ci .
      - name: Start public-safe runtime
        run: >-
          docker run -d --rm
          --name sam-wm-coolworld-ci
          -p 7860:7860
          -e COOLWORLD_LIVE_API_ENABLED=0
          sam-wm-coolworld:ci
      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7860/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs sam-wm-coolworld-ci || true
          exit 1
      - name: Verify product endpoints and guided UI without provider spend
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:7860/api/product-status > /tmp/product.json
          curl -fsS http://127.0.0.1:7860/api/evidence-summary > /tmp/evidence.json
          curl -fsS 'http://127.0.0.1:7860/api/evidence/timeline?limit=1' > /tmp/timeline.json
          curl -fsS http://127.0.0.1:7860/static/interpretability.js > /tmp/interpretability.js
          curl -fsS http://127.0.0.1:7860/static/city-model.js > /tmp/city-model.js
          grep -F 'START HERE · GUIDED DEMO' /tmp/interpretability.js
          grep -F 'How to read this coloured mask' /tmp/interpretability.js
          grep -F 'HOW THIS CITY FORECAST IS BUILT' /tmp/city-model.js
          grep -F 'PLAYBACK · Press ▶ or drag the slider' /tmp/city-model.js
          python - <<'PY'
          import json
          from pathlib import Path

          product = json.loads(Path('/tmp/product.json').read_text())
          timeline = json.loads(Path('/tmp/timeline.json').read_text())

          assert product['real_provider_evidence_ready'] is True
          assert product['model_bundle_promoted'] is True
          assert product['research_forecast_ready'] is True
          assert product['live_provider_api_enabled'] is False
          assert timeline['frame_count'] == 1
          print('public-safe product + guided UI smoke passed')
          PY
      - name: Verify live provider route is fail-closed by default
        shell: bash
        run: |
          status=$(curl -sS -o /tmp/live.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://127.0.0.1:7860/api/fortyguard/heatmap)
          cat /tmp/live.json
          test "$status" = "403"
      - name: Container logs on failure
        if: failure()
        run: docker logs sam-wm-coolworld-ci || true
      - name: Stop container
        if: always()
        run: docker stop sam-wm-coolworld-ci || true
