name: autofmt-once

on:
  push:
    branches:
      - coolworld-production-pass-final2

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coolworld-production-pass-final2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.5'
      - name: Format production pass
        run: |
          ruff format src/coolworld/app.py src/coolworld/product_api.py tests/test_product_api.py verify_runtime.py
          git diff --check
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/coolworld/app.py src/coolworld/product_api.py tests/test_product_api.py verify_runtime.py
          git commit -m 'style: apply Ruff formatting'
          git push origin HEAD:coolworld-production-pass-final2
